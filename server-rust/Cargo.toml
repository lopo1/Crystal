[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"

[workspace.dependencies]
flate2 = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "std"] }
rand = "0.8"
hex = "0.4"

[profile.release]
lto = true