[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"

[workspace.dependencies]
flate2 = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true